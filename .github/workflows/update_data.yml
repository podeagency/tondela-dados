name: Atualizar indicadores de Tondela

on:
  schedule:
    - cron: "0 6 * * 1"      # segundas-feiras, 06:00 UTC
  workflow_dispatch: {}       # permite correr manualmente (separador Actions)

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recolher, validar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
